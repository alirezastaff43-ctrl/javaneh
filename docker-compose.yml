services:
  database:
    image: ${POSTGRES_IMAGE:-postgres:16-bookworm}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-javaneh}
      POSTGRES_USER: ${POSTGRES_USER:-javaneh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - backend

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: db-migrate
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22-bookworm-slim}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
    restart: "no"
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
    depends_on:
      database:
        condition: service_healthy
    networks:
      - backend

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22-bookworm-slim}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      INTERNAL_PROVIDER_ALLOWED_HOSTS: ${INTERNAL_PROVIDER_ALLOWED_HOSTS:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AVALAI_API_KEY: ${AVALAI_API_KEY:-}
      BINAVIRA_API_BASE_URL: ${BINAVIRA_API_BASE_URL:-}
      BINAVIRA_FILES_BASE_URL: ${BINAVIRA_FILES_BASE_URL:-}
      BINAVIRA_API_TOKEN: ${BINAVIRA_API_TOKEN:-}
      AUTH_OTP_SECRET: ${AUTH_OTP_SECRET:?Set AUTH_OTP_SECRET in .env}
      SMS_PROVIDER_URL: ${SMS_PROVIDER_URL:-}
      SMS_PROVIDER_API_KEY: ${SMS_PROVIDER_API_KEY:-}
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      options:
        max-size: 10m
        max-file: "5"
    networks:
      - backend

  deadline-worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22-bookworm-slim}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
    command: ["node", "scripts/deadline-worker.mjs"]
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
    depends_on:
      migrate:
        condition: service_completed_successfully
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      options:
        max-size: 10m
        max-file: "5"
    networks:
      - backend

volumes:
  postgres_data:

networks:
  backend: